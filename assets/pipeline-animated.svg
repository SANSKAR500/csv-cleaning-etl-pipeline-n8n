<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">CSV Cleaning ETL Pipeline</title><desc id="desc">Gmail CSV attachment flows through parsing and Python cleaning, then branches to Supabase, Google Sheets and confirmation email, with an alert path for empty results.</desc><defs><style>.bg{fill:#0d1117}.box{fill:#161b22;stroke:#58a6ff;stroke-width:2}.branch{stroke:#3fb950}.alert{stroke:#8b949e;stroke-dasharray:8 6}.t{fill:#f0f6fc;font:600 20px Arial}.s{fill:#8b949e;font:14px Arial}.a{fill:none;stroke:#58a6ff;stroke-width:4}.dot{fill:#3fb950}</style></defs><rect class="bg" width="1400" height="520" rx="20"/><text x="700" y="48" text-anchor="middle" class="t">CSV → Cleaned Dataset ETL Pipeline</text><g><rect class="box" x="40" y="190" width="190" height="90" rx="14"/><text class="t" x="135" y="225" text-anchor="middle">Gmail Trigger</text><text class="s" x="135" y="250" text-anchor="middle">CSV attachment</text><rect class="box" x="285" y="190" width="190" height="90" rx="14"/><text class="t" x="380" y="225" text-anchor="middle">Parse CSV</text><text class="s" x="380" y="250" text-anchor="middle">JSON rows</text><rect class="box" x="530" y="190" width="190" height="90" rx="14"/><text class="t" x="625" y="225" text-anchor="middle">Clean &amp; Validate</text><text class="s" x="625" y="250" text-anchor="middle">Python + dedupe</text><rect class="box" x="775" y="190" width="190" height="90" rx="14"/><text class="t" x="870" y="225" text-anchor="middle">Valid Rows?</text><text class="s" x="870" y="250" text-anchor="middle">branch</text><rect class="box" x="1030" y="90" width="170" height="80" rx="14"/><text class="t" x="1115" y="122" text-anchor="middle">Supabase</text><text class="s" x="1115" y="147" text-anchor="middle">Postgres upsert</text><rect class="box" x="1030" y="210" width="170" height="80" rx="14"/><text class="t" x="1115" y="242" text-anchor="middle">Google Sheets</text><text class="s" x="1115" y="267" text-anchor="middle">append rows</text><rect class="box" x="1030" y="330" width="170" height="80" rx="14"/><text class="t" x="1115" y="362" text-anchor="middle">Confirmation</text><text class="s" x="1115" y="387" text-anchor="middle">clean CSV email</text><rect class="box" x="1230" y="330" width="130" height="80" rx="14"/><text class="t" x="1295" y="362" text-anchor="middle">Alert</text><text class="s" x="1295" y="387" text-anchor="middle">0 valid rows</text></g><path class="a" d="M230 235H285M475 235H530M720 235H775M965 235C1000 235 995 130 1030 130M965 235H1030M965 235C1000 235 995 370 1030 370M1200 370H1230"/><path class="alert" d="M870 280V370H1030"/><circle class="dot" r="7"><animateMotion dur="2s" repeatCount="indefinite" path="M230 235H285"/></circle><circle class="dot" r="7"><animateMotion dur="2s" begin=".4s" repeatCount="indefinite" path="M475 235H530"/></circle><circle class="dot" r="7"><animateMotion dur="2s" begin=".8s" repeatCount="indefinite" path="M720 235H775"/></circle></svg>