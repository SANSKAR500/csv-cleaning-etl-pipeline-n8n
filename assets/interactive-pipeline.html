<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Cleaning ETL Pipeline</title><style>body{margin:0;background:#0d1117;color:#f0f6fc;font:15px Arial;padding:30px}.flow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;max-width:1200px;margin:35px auto}.node{padding:20px;border:1px solid #58a6ff;border-radius:14px;background:#161b22;cursor:pointer;min-width:150px;text-align:center}.node:hover{outline:2px solid #3fb950}.arrow{font-size:28px}.panel{max-width:800px;margin:30px auto;padding:24px;border:1px solid #30363d;border-radius:14px;background:#161b22}button{padding:9px 14px;border-radius:8px;border:1px solid #30363d;background:#21262d;color:#f0f6fc;cursor:pointer}</style></head><body><h1>CSV → Cleaned Dataset Pipeline</h1><p>Click any node to see what it does.</p><div class="flow"><div class="node" data-title="Gmail Trigger" data-info="Polls Gmail for emails containing CSV attachments.">Gmail Trigger</div><span class="arrow">→</span><div class="node" data-title="Parse CSV" data-info="Converts the CSV attachment into structured JSON rows.">Parse CSV</div><span class="arrow">→</span><div class="node" data-title="Clean & Validate" data-info="Python type-casts fields, validates IDs, dates and amounts, rejects bad rows, normalizes status and deduplicates by order_id.">Clean & Validate</div><span class="arrow">→</span><div class="node" data-title="Valid Rows?" data-info="Routes successful cleaning to the load branches and sends an alert when no valid rows remain.">Valid Rows?</div><span class="arrow">→</span><div class="node" data-title="Destinations" data-info="Valid records are upserted to Supabase/Postgres, appended to Google Sheets, converted to a clean CSV and emailed as confirmation.">Postgres + Sheets + Email</div></div><div class="panel"><h2 id="title">Select a node</h2><p id="info">The explanation will appear here.</p><button onclick="location.reload()">Reset</button></div><script>document.querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>{document.getElementById('title').textContent=n.dataset.title;document.getElementById('info').textContent=n.dataset.info;}));</script></body></html>
