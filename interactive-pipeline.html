<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>CSV → Cleaned Dataset Pipeline — interactive diagram</title>
<style>
  :root {
    --bg: #0c0c0e;
    --panel: #151517;
    --border: #2a2a2e;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --accent: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 28px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  #controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: #4b5563; }
  #stage {
    position: relative;
    flex: 1;
    overflow: auto;
    padding: 24px;
  }
  svg { width: 100%; height: auto; min-width: 1100px; display: block; }
  .node { cursor: pointer; }
  .node .node-box { transition: filter .15s, transform .15s, stroke-width .15s; transform-origin: center; transform-box: fill-box; }
  .node:hover .node-box, .node.active .node-box {
    stroke-width: 3;
    filter: drop-shadow(0 0 10px rgba(34,197,94,.35));
  }
  .node.dimmed { opacity: .35; }
  .edge.dimmed, .flow-dot.dimmed { opacity: .12; }
  #panel {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: 340px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 22px;
    transform: translateX(100%);
    transition: transform .25s ease;
    overflow-y: auto;
  }
  #panel.open { transform: translateX(0); }
  #panel h2 { font-size: 16px; margin: 0 0 4px; }
  #panel .kicker { color: var(--accent); font-size: 11.5px; letter-spacing: .02em; margin-bottom: 14px; }
  #panel p { color: #d1d5db; font-size: 13.5px; line-height: 1.55; }
  #panel .close { position: absolute; top: 18px; right: 18px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0; }
  footer {
    padding: 10px 28px;
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
  }
</style>
</head>

<script>
const details = {
  "gmail_trigger": {
    "title": "Gmail Trigger",
    "body": "Polls the inbox every minute for messages matching has:attachment filename:csv, and downloads the CSV automatically."
  },
  "parse_csv": {
    "title": "Parse CSV to JSON",
    "body": "Reads the CSV attachment into JSON rows, using the header row as field names."
  },
  "clean_validate": {
    "title": "Clean &amp; Validate Data",
    "body": "A native Python code node with no network access. Type-casts order_id, customer_name, delivery_date (4 formats tried), amount (currency symbols stripped) and status (lowercased). Rejects rows with a missing ID, unparseable date, or invalid amount &mdash; tagging each with why. Deduplicates the valid rows by order_id, keeping whichever has the most recent delivery_date."
  },
  "has_valid": {
    "title": "Has Valid Rows?",
    "body": "Branches the run on whether anything survived cleaning, so the pipeline never silently loads zero rows without telling anyone."
  },
  "load_postgres": {
    "title": "Load to Postgres",
    "body": "Upserts cleaned rows into Supabase's deliveries_clean table, matching on order_id &mdash; idempotent, so re-running on the same file updates rather than duplicates."
  },
  "prepare_cols": {
    "title": "Prepare CSV Columns",
    "body": "Maps each cleaned field onto a flat column set, ready to be written back out as a file."
  },
  "load_sheets": {
    "title": "Load to Google Sheets",
    "body": "Appends cleaned rows to the Cleaned Data tab. Runs in parallel with the Postgres branch, so one destination failing doesn't block the other."
  },
  "convert_csv": {
    "title": "Convert to CSV",
    "body": "Converts the cleaned rows back into a binary cleaned_deliveries.csv file."
  },
  "send_ok": {
    "title": "Send confirmation",
    "body": "Emails a confirmation once Postgres and Sheets have both been written, with the cleaned CSV attached."
  },
  "send_alert": {
    "title": "Send alert",
    "body": "If zero rows survive cleaning, sends an alert email instead &mdash; listing every rejected row and its rejection reason (missing_id / invalid_date / invalid_amount)."
  }
};

const svgEl = document.querySelector('#stage svg');
const nodes = [...document.querySelectorAll('.node')];
const edges = [...document.querySelectorAll('.edge')];
const dots = [...document.querySelectorAll('.flow-dot')];
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
const panelBody = document.getElementById('panelBody');

// Build adjacency from edge ids: "path-<a>-<b>"
function neighborsOf(key) {
  const involved = new Set();
  edges.forEach(e => {
    const id = e.id || '';
    const rest = id.replace('path-', '');
    const parts = Object.keys(details);
    // find split point: try each node name as prefix
    for (const a of parts) {
      if (rest.startsWith(a + '-')) {
        const b = rest.slice(a.length + 1);
        if (a === key || b === key) {
          involved.add(a); involved.add(b);
          e.dataset.a = a; e.dataset.b = b;
        }
      }
    }
  });
  return involved;
}

nodes.forEach(n => {
  const key = n.dataset.node;
  n.addEventListener('mouseenter', () => highlight(key));
  n.addEventListener('mouseleave', () => clearHighlight());
  n.addEventListener('click', () => openPanel(key));
});

function highlight(key) {
  const involved = neighborsOf(key);
  nodes.forEach(n => n.classList.toggle('dimmed', !involved.has(n.dataset.node)));
  edges.forEach((e, i) => {
    const id = (e.id || '').replace('path-', '');
    const on = involved.size && (id.startsWith(key + '-') || id.endsWith('-' + key));
    e.classList.toggle('dimmed', !on);
    if (dots[i]) dots[i].classList.toggle('dimmed', !on);
  });
}

function clearHighlight() {
  nodes.forEach(n => n.classList.remove('dimmed'));
  edges.forEach(e => e.classList.remove('dimmed'));
  dots.forEach(d => d.classList.remove('dimmed'));
}

function openPanel(key) {
  const d = details[key];
  if (!d) return;
  nodes.forEach(n => n.classList.toggle('active', n.dataset.node === key));
  panelTitle.innerHTML = d.title;
  panelBody.innerHTML = d.body;
  panel.classList.add('open');
}

document.getElementById('closePanel').addEventListener('click', () => {
  panel.classList.remove('open');
  nodes.forEach(n => n.classList.remove('active'));
});

let playing = true;
document.getElementById('toggleAnim').addEventListener('click', (e) => {
  if (!svgEl.pauseAnimations) return;
  playing = !playing;
  if (playing) { svgEl.unpauseAnimations(); e.target.textContent = 'Pause flow'; }
  else { svgEl.pauseAnimations(); e.target.textContent = 'Resume flow'; }
});
</script>

</body>
</html>
